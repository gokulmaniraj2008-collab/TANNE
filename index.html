<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANNE RESTOBAR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 2s ease forwards;
    }

    .logo-container img {
      width: 320px;
      max-width: 90vw;
      height: auto;
      filter: drop-shadow(0 0 30px rgba(201, 162, 39, 0.5));
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(201,162,39,0.4)); }
      50%       { filter: drop-shadow(0 0 50px rgba(201,162,39,0.9)); }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="IMG-20260522-WA0003.jpg" alt="TANNE RESTOBAR Logo">
  </div>

</body>
</html>
