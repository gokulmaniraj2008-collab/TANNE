<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TANNE RESTOBAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- SPLASH -->
<div class="screen active" id="splash">
  <div class="logo-wrap">
    <div class="logo-name">TANNE</div>
    <div class="logo-tagline">RESTOBAR</div>
    <div class="splash-bar"></div>
  </div>
</div>

<!-- LOGIN -->
<div class="screen" id="login">
  <div class="login-card">
    <div class="login-logo"><div class="logo-name">TANNE</div></div>
    <div class="login-title">Welcome Back</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="staff@tanne.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••"/>
    </div>
    <div class="forgot">Forgot password?</div>
    <button class="btn-gold" onclick="doLogin()">SIGN IN</button>
    <div class="divider"><hr/><span>or</span><hr/></div>
    <button class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>
    <div class="signup-text">Don't have an account? <span>Sign up</span></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="screen" id="dashboard">
  <div class="app-header">
    <div class="logo-name">TANNE</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="avatar" id="userAvatar">S</div>
      <button class="logout-btn" onclick="doLogout()">LOGOUT</button>
    </div>
  </div>
  <div class="dashboard-body">
    <div class="section-title">Tables</div>
    <div class="section-sub">Select a table to manage orders</div>
    <div class="tables-grid" id="tablesGrid"></div>
  </div>
</div>

<!-- ORDER -->
<div class="screen" id="order">
  <div class="app-header">
    <button onclick="goBack()" style="background:none;border:none;color:var(--gold);font-size:20px;cursor:pointer;">←</button>
    <div class="logo-name">TANNE</div>
    <div class="avatar" id="orderAvatar">S</div>
  </div>
  <div class="order-body">
    <div style="padding:14px 16px 0;">
      <div class="section-title" id="orderTableTitle">Table 1</div>
      <div class="section-sub">TAP ITEM TO ADD · ADJUST QUANTITY</div>
    </div>

    <div id="savedOrdersWrap"></div>

    <div class="order-search-bar">
      <div class="search-input-wrap">
        <svg width="16" height="16" fill="none" stroke="#888" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="search-input" id="searchInput" placeholder="Search menu..." oninput="filterMenu()"/>
        <button class="clear-search" onclick="clearSearch()">×</button>
      </div>
    </div>

    <div class="menu-scroll" id="menuScroll"></div>

    <div class="cart-bar">
      <div class="cart-info">
        <span id="cartCount">0</span> items · <span id="cartTotal">₹0</span>
      </div>
      <div class="cart-actions">
        <button class="btn-save" onclick="saveOrder()">SAVE ORDER</button>
        <button class="btn-bill" onclick="generateBill()">BILL</button>
      </div>
    </div>
  </div>
</div>

<!-- BILL -->
<div class="screen" id="bill">
  <div class="app-header">
    <button onclick="showScreen('order')" style="background:none;border:none;color:var(--gold);font-size:20px;cursor:pointer;">←</button>
    <div class="logo-name">TANNE</div>
    <div style="width:34px;"></div>
  </div>
  <div class="bill-body">
    <div class="bill-header">
      <div class="logo-name">TANNE</div>
      <div class="logo-tagline">RESTOBAR</div>
      <div class="bill-meta">
        <span id="billTable"></span> &nbsp;|&nbsp;
        <span id="billDate"></span> &nbsp;|&nbsp;
        <span id="billTime"></span>
      </div>
    </div>
    <hr class="bill-divider"/>
    <div id="billItems"></div>
    <hr class="bill-divider"/>
    <div class="bill-total-row"><span>Subtotal</span><span id="billSubtotal"></span></div>
    <div class="bill-total-row"><span>GST (5%)</span><span id="billGST"></span></div>
    <div class="bill-grand"><span>TOTAL</span><span id="billTotal"></span></div>
    <div class="bill-actions">
      <button class="btn-outline" onclick="clearTable()">Clear Table</button>
      <button class="btn-print" onclick="window.print()">Print Bill</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
