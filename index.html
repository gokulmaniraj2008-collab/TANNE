<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanne Restobar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh; /* dynamic viewport for mobile */
    }

    .logo-container {
      width: 90%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /*

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(201,162,39,0.4)); }
      50%       { filter: drop-shadow(0 0 50px rgba(201,162,39,0.9)); }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="IMG-20260522-WA0003.jpg" alt="TANNE RESTOBAR Logo">
  </div>

</body>
</html>
